<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Elements Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at 50% 35%, #17132b 0%, #0b0914 62%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
    }

    .logo-wrap {
      position: relative;
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
    }

    /* anel orbitando a logo */
    .logo-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7c3aed 0%, #8b5cf6 28%, transparent 60%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation: spin 1.15s linear infinite;
      opacity: .9;
    }

    .logo-wrap img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      animation: breathe 2.1s ease-in-out infinite;
      filter: drop-shadow(0 8px 26px rgba(124, 58, 237, .38));
    }

    .brand {
      color: #ffffff;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    .brand span { color: #a78bfa; }

    .tagline {
      color: rgba(196, 181, 253, .62);
      font-size: 12px;
      margin-top: -12px;
    }

    .loader {
      width: 190px;
      height: 3px;
      border-radius: 3px;
      background: rgba(139, 92, 246, .18);
      overflow: hidden;
      margin-top: 6px;
    }

    .loader .fill {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      animation: slide 1.15s ease-in-out infinite;
    }

    .status {
      color: rgba(255, 255, 255, .41);
      font-size: 11px;
      letter-spacing: .6px;
    }

    .status .dots::after {
      content: "";
      display: inline-block;
      width: 1.35em;
      text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.045); }
    }

    @keyframes slide {
      0%   { margin-left: -42%; }
      100% { margin-left: 100%; }
    }

    @keyframes dots {
      0%  { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-ring, .logo-wrap img, .loader .fill { animation: none; }
      .loader .fill { width: 100%; opacity: .55; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap" aria-hidden="true">
    <div class="logo-ring"></div>
    <img src="../dist/logo.png" alt="" draggable="false" />
  </div>

  <div class="brand">Elements <span>Launcher</span></div>
  <div class="tagline">Central de aplicativos do Elements</div>

  <div class="loader" aria-hidden="true"><div class="fill"></div></div>
  <div class="status">Iniciando<span class="dots"></span></div>
</body>
</html>
