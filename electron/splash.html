<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Elements Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at 50% 38%, #171331 0%, #0b0914 64%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Halo suave atrás da logo (sem máscaras, sem artefatos) */
    .logo-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
    }

    .halo {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.28) 0%, rgba(139, 92, 246, 0.08) 45%, transparent 70%);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .logo-wrap img {
      position: relative;
      width: 92px;
      height: 92px;
      object-fit: contain;
      animation: breathe 2.4s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(124, 58, 237, 0.45));
    }

    .brand {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-top: -6px;
    }

    .brand span { color: #a78bfa; }

    .tagline {
      color: rgba(196, 181, 253, 0.55);
      font-size: 11.5px;
      margin-top: -10px;
    }

    /* Barra indeterminada */
    .loader {
      width: 180px;
      height: 3px;
      border-radius: 3px;
      background: rgba(139, 92, 246, 0.16);
      overflow: hidden;
      margin-top: 4px;
    }

    .loader .fill {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      animation: slide 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    /* Três pontos que sobem/descem em cascata */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 11.5px;
      letter-spacing: 0.8px;
    }

    .dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .dots i {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #a78bfa;
      animation: bounce 1.05s ease-in-out infinite;
    }

    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50%      { transform: scale(1.06); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    @keyframes slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(380%); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(-2.5px); opacity: 0.45; }
      50%      { transform: translateY(2.5px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .halo, .logo-wrap img, .loader .fill, .dots i { animation: none; }
      .loader .fill { width: 100%; opacity: 0.55; transform: none; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap" aria-hidden="true">
    <div class="halo"></div>
    <img src="../dist/logo.png" alt="" draggable="false" />
  </div>

  <div class="brand">Elements <span>Launcher</span></div>
  <div class="tagline">Central de aplicativos do Elements</div>

  <div class="loader" aria-hidden="true"><div class="fill"></div></div>

  <div class="status">
    Iniciando
    <span class="dots"><i></i><i></i><i></i></span>
  </div>
</body>
</html>
